<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>영월-문경 여행 일정</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Travel Plan</p>
          <h1 id="trip-title">영월-문경 2박 3일 여행</h1>
          <p id="trip-period" class="muted">2026-08-29 ~ 2026-08-31</p>
        </div>
        <div class="topbar-actions">
          <button id="reset-data" class="ghost-button" type="button">초기화</button>
          <button id="import-json" class="ghost-button" type="button">JSON 불러오기</button>
          <button id="export-json" class="primary-button" type="button">JSON 내보내기</button>
          <input id="file-input" type="file" accept="application/json,.json" hidden />
        </div>
      </header>

      <main class="layout">
        <section class="main-panel">
          <div class="route-card">
            <div class="route-heading">
              <div>
                <p class="eyebrow">Route</p>
                <h2>인천에서 영월, 문경 거쳐 귀가</h2>
              </div>
              <span id="base-label" class="base-chip"></span>
            </div>
            <div id="route-strip" class="route-strip"></div>
          </div>

          <div class="day-tabs" id="day-tabs"></div>
          <div id="timeline" class="timeline"></div>
        </section>

        <aside class="side-panel">
          <section class="summary-grid">
            <div class="stat-card">
              <span class="stat-label">일정</span>
              <strong id="day-count">3일</strong>
            </div>
            <div class="stat-card">
              <span class="stat-label">예약</span>
              <strong id="reservation-count">0건</strong>
            </div>
            <div class="stat-card">
              <span class="stat-label">확인 필요</span>
              <strong id="todo-count">0건</strong>
            </div>
          </section>

          <section class="panel-section">
            <div class="section-title">
              <h2>확정 예약</h2>
            </div>
            <div id="reservations" class="reservation-list"></div>
          </section>

          <section class="panel-section">
            <div class="section-title">
              <h2>확인 필요</h2>
            </div>
            <div id="open-items" class="todo-list"></div>
          </section>

          <section class="panel-section">
            <div class="section-title">
              <h2>일정 편집</h2>
              <button id="clear-form" class="text-button" type="button">비우기</button>
            </div>
            <form id="item-form" class="edit-form">
              <input type="hidden" id="item-id" />
              <label>
                날짜
                <select id="item-date"></select>
              </label>
              <label>
                시간대
                <input id="item-time" placeholder="예: 17:00 이후~밤" />
              </label>
              <label>
                구분
                <select id="item-type">
                  <option>빈 시간</option>
                  <option>이동</option>
                  <option>숙소</option>
                  <option>준비</option>
                  <option>액티비티</option>
                  <option>자유 일정</option>
                  <option>귀가</option>
                </select>
              </label>
              <label>
                제목
                <input id="item-title" placeholder="일정 제목" required />
              </label>
              <label>
                장소
                <input id="item-location" placeholder="장소 또는 주소" />
              </label>
              <label>
                상태
                <input id="item-status" placeholder="확정 / 미정 / 예매 완료" />
              </label>
              <label>
                메모
                <textarea id="item-note" rows="3" placeholder="필요한 메모"></textarea>
              </label>
              <button class="primary-button full" type="submit">일정 저장</button>
            </form>
          </section>
        </aside>
      </main>
    </div>

    <script src="./app.js" type="module"></script>
  </body>
</html>
