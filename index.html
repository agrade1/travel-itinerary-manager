<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>영월-문경 여행 일정</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Travel Plan</p>
          <h1 id="trip-title">영월-문경 2박 3일 여행</h1>
          <p id="trip-period" class="muted">2026-08-29 ~ 2026-08-31</p>
        </div>
      </header>

      <main class="layout">
        <section class="main-panel">
          <div class="route-card">
            <div class="route-heading">
              <div>
                <p class="eyebrow">Route</p>
                <h2>인천에서 원주, 영월 숙소, 문경 거쳐 귀가</h2>
              </div>
              <span id="base-label" class="base-chip"></span>
            </div>
            <div id="route-strip" class="route-strip"></div>
          </div>

          <div class="day-tabs" id="day-tabs"></div>
          <div id="timeline" class="timeline"></div>
        </section>

        <aside class="side-panel">
          <section class="summary-grid">
            <div class="stat-card">
              <span class="stat-label">일정</span>
              <strong id="day-count">3일</strong>
            </div>
            <div class="stat-card">
              <span class="stat-label">예약</span>
              <strong id="reservation-count">0건</strong>
            </div>
            <div class="stat-card">
              <span class="stat-label">확인 필요</span>
              <strong id="todo-count">0건</strong>
            </div>
          </section>

          <section class="panel-section">
            <div class="section-title">
              <h2>확정 예약</h2>
            </div>
            <div id="reservations" class="reservation-list"></div>
          </section>

          <section class="panel-section">
            <div class="section-title">
              <h2>식사 계획</h2>
            </div>
            <div id="meals" class="meal-list"></div>
          </section>

          <section class="panel-section">
            <div class="section-title">
              <h2>확인 필요</h2>
            </div>
            <div id="open-items" class="todo-list"></div>
          </section>
        </aside>
      </main>
    </div>

    <script src="./app.js" type="module"></script>
  </body>
</html>
